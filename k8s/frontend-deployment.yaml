apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels: 
        app: frontend  
    spec:
      containers:
        - name: frontend-container 
          image: task1-frontend:latest
          ports:
            - containerPort: 3000
          imagePullPolicy: Never
