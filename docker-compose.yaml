version: "3.9"

services:
  
  frontend:
    build: ./frontend
    container_name: frontend-container
    ports:
      - "3000:3000"
    depends_on:
      - backend


  backend:
    build: ./backend
    container_name: backend-container
    ports:
      - "5000:5000"
    depends_on:
      - mongo
  

  mongo:
    image: mongo
    container_name: mongo-container
    ports:
      - "27017:27017"
    